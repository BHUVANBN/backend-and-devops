# Nginx Configuration (Standalone Proxy Template)
# This file is used for standard Nginx setups (e.g., bare-metal Linux or EC2) 
# to route external traffic to your microservices via the API Gateway.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Modern, secure TLS settings (Intermediate profile)
    sendfile        on;
    keepalive_timeout  65;

    # Backend Services Definition
    # These point to the internal IPs or hostnames of your services.
    upstream gateway_backend {
        server api-gateway:3000;
    }

    server {
        listen 80;
        server_name api.myapp.com;

        # Gzip Compression (Production performance)
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml;

        # Health Check
        location /health {
            access_log off;
            return 200 'Nginx Healthy';
        }

        # Main API Proxy
        location / {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts prevent resources from being held indefinitely by slow clients
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Handle Errors (Custom Error Pages)
        # Production systems should never leak trace details to the client
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
