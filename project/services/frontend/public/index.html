<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microservice Dashboard | Production System</title>
    <!-- Modern Typography: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --secondary: #818cf8;
            --accent: #f472b6;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Header & Glassmorphism --- */
        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border-radius: 99px;
            font-size: 0.8rem;
            border: 1px solid rgba(34, 197, 94, 0.3);
            margin-top: 0.5rem;
        }

        /* --- Dashboard Grid --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            padding: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* --- Forms & Inputs --- */
        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 0.75rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* --- Logs Panel --- */
        .logs-panel {
            grid-column: 1 / -1;
            background: #000;
            border-radius: 1rem;
            padding: 1.5rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            height: 300px;
            overflow-y: auto;
            border: 1px solid var(--secondary);
            color: #10b981;
        }

        .log-entry { margin-bottom: 0.5rem; }
        .log-time { color: var(--text-dim); margin-right: 0.5rem; }
        .log-error { color: #f43f5e; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Icons (Pseudo) --- */
        .icon-auth::before { content: '🔑'; }
        .icon-payment::before { content: '💳'; }
        .icon-media::before { content: '🖼️'; }
        .icon-order::before { content: '📦'; }

        /* Tablet/Mobile fixes */
        @media (max-width: 768px) {
            body { padding: 1rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Cloud Architecture Dashboard</h1>
        <p>Real-time microservices management & Monitoring</p>
        <div class="status-badge">Cluster Internal Network: Active</div>
    </header>

    <div class="dashboard-grid">
        <!-- Auth Card -->
        <article class="card">
            <h2 class="icon-auth">Identity Management</h2>
            <form id="authForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="authEmail" placeholder="admin@domain.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="authPass" value="••••••••" required>
                </div>
                <button type="button" class="btn" onclick="handleLogin()">Establish Secure Session (JWT)</button>
            </form>
        </article>

        <!-- Order Card -->
        <article class="card">
            <h2 class="icon-order">Order Service</h2>
            <div class="form-group">
                <label>Target User ID</label>
                <input type="text" id="orderUserId" value="user_772" readonly>
            </div>
            <div class="form-group">
                <label>Order Total ($)</label>
                <input type="number" id="orderAmount" value="249.00">
            </div>
            <button type="button" class="btn" style="background: var(--secondary);" onclick="handleCreateOrder()">Dispatch Order to KAFKA</button>
        </article>

        <!-- Payment Card -->
        <article class="card">
            <h2 class="icon-payment">Razorpay Integration</h2>
            <div class="form-group">
                <label>Order Amount</label>
                <input type="text" id="razorpayAmount" value="₹500.00">
            </div>
            <button type="button" class="btn" style="background: var(--accent);" onclick="handlePayment()">Create Razorpay Order</button>
        </article>

        <!-- Media Card -->
        <article class="card">
            <h2 class="icon-media">Cloud Media Engine</h2>
            <div class="form-group">
                <label>Select High-Res Asset</label>
                <input type="file" id="mediaUpload">
            </div>
            <button type="button" class="btn" onclick="handleUpload()">Push to Cloudinary CDN</button>
        </article>

        <!-- Monitoring Console -->
        <div class="logs-panel" id="logConsole">
            <div class="log-entry"><span class="log-time">[16:00:00]</span> Establishing handshake with API Gateway...</div>
            <div class="log-entry"><span class="log-time">[16:00:01]</span> Gateway connected. All endpoints UP.</div>
        </div>
    </div>
</div>

<script>
    const GATEWAY_URL = 'http://localhost:3000/api/v1';

    function addLog(message, isError = false) {
        const console = document.getElementById('logConsole');
        const entry = document.createElement('div');
        entry.className = `log-entry ${isError ? 'log-error' : ''}`;
        const time = new Date().toLocaleTimeString();
        entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
        console.appendChild(entry);
        console.scrollTop = console.scrollHeight;
    }

    async function handleLogin() {
        addLog('Attempting Auth Handshake...');
        // Mocked as real API endpoints require the backend to be running
        setTimeout(() => {
            addLog('✅ JWT Token Issued successfully.');
            addLog('Session active for: 24h');
        }, 800);
    }

    async function handleUpload() {
        const file = document.getElementById('mediaUpload').files[0];
        if(!file) return alert('Select a file first!');
        addLog(`Preparing upload for ${file.name}...`);
        addLog('Connecting to Media Service via Gateway...');
        setTimeout(() => {
            addLog(`✅ Asset successfully buffered and pushed to Cloudinary.`);
        }, 1500);
    }

    async function handleCreateOrder() {
        const amount = document.getElementById('orderAmount').value;
        addLog(`Creating internal Order record ($${amount})...`);
        setTimeout(() => {
            addLog('✅ Order persisted in Neon PostgreSQL.');
            addLog('⚡ Event Emitted: topic:ORDER_CREATED partitions:1');
        }, 1200);
    }

    async function handlePayment() {
        addLog('Connecting to Razorpay API via Gateway...');
        setTimeout(() => {
            addLog('✅ Razorpay Order ID received: order_abc123');
            addLog('Ready for Razorpay Checkout UI.');
        }, 1000);
    }
</script>

</body>
</html>
