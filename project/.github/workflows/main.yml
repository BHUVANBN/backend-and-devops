name: Production-Scale CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

/**
 * CI/CD Pipeline: The Automated Delivery Engine
 * 
 * In a professional microservices environment, we NEVER deploy manually.
 * This pipeline automates the testing, Dockerization, and deployment.
 */

jobs:
  # Build and Push Job: Builds images for each service 
  # and pushes them to GitHub Container Registry (GHCR).
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    strategy:
      matrix:
        # Define all services to build in parallel
        # This speeds up the overall CI/CD process significantly.
        service: [api-gateway, auth-service, media-service, payment-service]
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Create Lowercase for Docker Image Name
      - name: Set Image Name
        run: echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}" >> $GITHUB_ENV

      # Docker Build and Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./services/${{ matrix.service }}
          push: true
          # Use both 'latest' and the short commit SHA for versioning
          # This allows us to rollback to a specific version if needed.
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # Deploy Job: In a real AWS setup, this job would trigger the 
  # updating of the Kubernetes deployment images.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Manifests
        uses: actions/checkout@v3

      # Use 'kubectl' with AWS EKS credentials (typically managed via secrets)
      # to apply the new configurations to the cluster.
      - name: Deploy to Kubernetes Cluster (Mock Step)
        run: |
          echo "🚀 Starting Deployment to Kubernetes..."
          # In a real environment:
          # aws eks update-kubeconfig --name my-eks-cluster
          # kubectl apply -f infra/kubernetes/
          # kubectl set image deployment/auth-service auth-service=${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "✅ Deployment Successful!"
