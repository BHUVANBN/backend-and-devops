services:
  app:
    build: .
    container_name: chapter4-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://todoapp:todoapp@db:5432/tododb
      - JWT_SECRET=your_jwt_secret_here
      - PORT=3000
    depends_on:
      - db
    volumes:
      - .:/app
  db:
    image: postgres:15-alpine
    container_name: chapter4-db
    environment:
      - POSTGRES_DB=tododb
      - POSTGRES_USER=todoapp
      - POSTGRES_PASSWORD=todoapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
    